# ============================================================================
# Eclipse Mosquitto 2.x -- pdm-pipeline local development broker
# ============================================================================
# SECURITY NOTE: this broker is deliberately wide open (no authentication, no
# TLS). That is acceptable ONLY because it is a LOCAL DEV broker reachable
# from this machine and the "pdm" Docker network. Before this is exposed to
# anything shared or production, set `allow_anonymous false`, add a
# `password_file` (or mTLS), and move the listener to 8883 with TLS.
# ============================================================================

# ------------------------------------------------------------------ listener
# Mosquitto 2.x defaults to binding loopback only, so bind 0.0.0.0 explicitly
# to accept connections from the host port mapping and from sibling containers
# (the Kafka bridge / Flink will connect over the "pdm" network later).
listener 1883 0.0.0.0

# LOCAL DEV ONLY -- anyone able to reach port 1883 may publish and subscribe.
allow_anonymous true

# --------------------------------------------------------------- persistence
# Retained messages, queued QoS 1/2 messages and durable subscriptions are
# written to /mosquitto/data/mosquitto.db so they survive a broker restart.
# The directory must be writable by uid 1883 (the user inside the image).
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ------------------------------------------------------------------- queueing
# Per-client queue of QoS 1/2 messages for a persistent session that is offline
# (or whose in-flight window is full). The MQTT->Kafka bridge uses a persistent
# session, so this is what holds telemetry while the bridge is down or Kafka is
# slow. The default of 1000 silently DROPS anything beyond that; 200000 is ~45
# full hold-out replays (~150-200 MB of broker memory if it ever fills -- see
# mem_limit in docker-compose.yml).
max_queued_messages 200000

# Forget persistent sessions (and their queues) of MQTT 3.x clients that have
# been disconnected for more than a day. MQTT 5 clients set their own session
# expiry in CONNECT (the bridge asks for 1 day too).
persistent_client_expiration 1d

# ------------------------------------------------------------------- logging
# File log for post-mortem inspection, stdout so `docker compose logs
# mosquitto` and the Docker health reporting show the same information.
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
connection_messages true
